name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.1

      - name: Check the CV-005 contracts
        run: make test-workflow-contracts
      - name: Install Rust for Merman
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.95.0'

      - name: Install Markdown diagram tooling
        run: |
          uv tool install nixie-cli==1.1.0
          cargo +1.95.0 install merman-cli --version '=0.7.0' --locked

      - name: Install CLI tools
        run: |
          for tool in mbake ty ruff; do uv tool install ${tool}; done

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@8e6a325765ba382691d1b1c65fcccf1fc1d1b00c
        with:
          version: "0.6.1"

      - name: Check formatting
        run: make check-fmt

      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make markdownlint`.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'

      - name: Check spelling
        run: make spelling

      - name: Validate Mermaid diagrams
        run: make nixie

      - name: Install the YAML lint tools
        uses: leynos/shared-actions/.github/actions/install-yaml-lint@26c918632c5413039a84358fafe012a4399a9ec7
      - name: Run ruff
        run: make lint

      - name: Run typechecker
        run: make typecheck

      # Pull requests compare against the ratchet written by coverage-main.yml.
      # CodeScene publication belongs exclusively to that main-branch workflow.
      # A push to main skips this step so that the publisher is the one writer
      # of the baseline, and publish-artefact is off because the report is
      # compared, not published.
      - name: Generate coverage
        if: github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/generate-coverage@8e6a325765ba382691d1b1c65fcccf1fc1d1b00c
        # Pinned to the interpreter setup-python installs, in both lanes:
        # the action builds its coverage environment with whatever
        # interpreter uv finds first, which an earlier step's managed
        # download can change, and a baseline measured on one Python is
        # not comparable with a lane measured on another.
        env:
          UV_PYTHON: '3.13'
        with:
          language: python
          python-source: ./polythene
          output-path: coverage.xml
          format: cobertura
          pytest-workers: ''
          with-ratchet: 'true'
          publish-artefact: 'false'

  # The release publishes this build's sdist alongside its wheel, so a pull
  # request that produced none, or two, must fail here rather than at tag
  # time. The same composite action and cardinality check run in release.yml.
  wheel-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pure-python-wheel
        with:
          python-version: '3.13'
          artifact-name: wheels-pure
      - name: Require exactly one sdist to travel with the wheel
        shell: bash
        env:
          WHEEL_DIR: dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          sdists=("${WHEEL_DIR}"/*.tar.gz)
          wheels=("${WHEEL_DIR}"/*.whl)
          if [ "${#sdists[@]}" -ne 1 ]; then
            echo "Expected exactly one source distribution." >&2
            echo "Matched: ${sdists[*]:-<none>}" >&2
            ls -al "${WHEEL_DIR}" >&2
            exit 1
          fi
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "Expected exactly one pure Python wheel." >&2
            echo "Matched: ${wheels[*]:-<none>}" >&2
            exit 1
          fi
