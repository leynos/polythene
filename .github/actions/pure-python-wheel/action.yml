---
name: Build Pure Python Wheel and Sdist
description: >-
  Builds the source distribution and, from it, the pure Python wheel using uv,
  then uploads both as one artefact.
inputs:
  python-version:
    description: Python version to set up
    required: true
  artifact-name:
    description: Name of the uploaded artefact
    required: true
runs:
  using: composite
  steps:
    # The caller checks the repository out: a local action has to be on disk
    # before GitHub can resolve it, so this step cannot be the first one.
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      with:
        enable-cache: false
    # Without --sdist or --wheel, uv builds the sdist first and then the wheel
    # from that sdist, so every run also proves the sdist is buildable. The
    # directory is fixed rather than an input: the upload's `path` must be
    # decidable from the document alone, and a caller-supplied directory could
    # not be shown to stay outside a coverage lane's workspace, so the CV-005
    # `coverage.lane-hardening` rule would refuse it.
    - name: Build sdist and wheel
      shell: bash
      run: |
        set -euo pipefail
        uv build --out-dir dist
    - name: Upload sdist and wheel artefact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          dist/*.whl
          dist/*.tar.gz
